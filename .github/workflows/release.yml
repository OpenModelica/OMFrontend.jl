name: Release

# A version bump of Project.toml merged to master: start the OpenModelica registry's
# auto-update so it registers the version now (its daily run at 23:00 UTC registers it
# otherwise). Runs only when Project.toml changes, and does nothing unless its version
# changed. It does not tag: TagBot (TagBot.yml) tags vX.Y.Z and makes the GitHub release
# after the General registration is merged, as General asks, and dispatches the docs.
#
# Starting the registry's workflow needs the REGISTRY_DISPATCH_TOKEN secret: a
# fine-grained token with Actions: write on OpenModelica/OpenModelicaRegistry.
# Without it the daily run registers the version.

on:
  push:
    branches:
      - master
    paths:
      - Project.toml

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Version change
        id: version
        run: |
          new=$(sed -n 's/^version = "\(.*\)"/\1/p' Project.toml | head -1)
          old=$(git show HEAD^:Project.toml 2>/dev/null | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ -n "$new" ] && [ "$new" != "$old" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Version $old -> $new"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No new version (Project.toml $new, before $old)"
          fi

      - name: Registry auto-update
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.new }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No REGISTRY_DISPATCH_TOKEN: the registry's daily auto-update registers v$VERSION (23:00 UTC)."
            exit 0
          fi
          gh workflow run auto-update.yml --repo OpenModelica/OpenModelicaRegistry --ref master
          echo "Started the registry's auto-update for v$VERSION."
