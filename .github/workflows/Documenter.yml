name: Documenter

on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:

# Cancel in-flight doc builds when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  docs:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # Required to push to gh-pages.
      contents: write
      # Required for PR previews.
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout OMFrontend.jl
        uses: actions/checkout@v4
        with:
          path: OMFrontend.jl

      # The docs step does `Pkg.develop(path = OMFrontend.jl)`, which makes Pkg
      # inspect the package git tree. The test-only `test/3rdParty/Buildings`
      # submodule is not fetched (submodules: false) and is not needed for docs,
      # but its presence makes LibGit2 fail with "cannot get submodules without
      # a working tree". Drop the reference so develop operates on a clean tree.
      - name: Drop test-only submodule (not needed for docs)
        shell: bash
        run: |
          rm -f OMFrontend.jl/.gitmodules
          rm -rf OMFrontend.jl/test/3rdParty/Buildings

      # OMFrontend.jl/Project.toml uses [sources] to point at sibling working
      # copies. We mirror the CI workflow and lay the siblings out alongside the
      # main checkout.
      # The shared action checks the siblings out at the branch that matches
      # this change (the PR branch if the sibling has it, else the PR base
      # branch, e.g. 1.13, else master) from the OpenModelica repositories.
      - name: Checkout sibling OM*.jl packages
        uses: JKRT/OM.jl/.github/actions/checkout-siblings@master
        with:
          packages: Absyn ArrayUtil DAE DoubleEnded ImmutableList ListUtil MetaModelica OMParser OMRuntimeExternalC SCode

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - uses: julia-actions/cache@v2

      - name: Instantiate package environment
        # Same sibling-develop dance as ci.yml: Project.toml [sources] only
        # applies to direct deps, so transitive deps (e.g. DoubleEnded via
        # ListUtil) and stale registry versions (e.g. an Absyn without
        # MetaModelica in its Project.toml) otherwise sneak in.
        shell: bash
        working-directory: OMFrontend.jl
        run: |
          julia --project -e '
            import Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/OpenModelica/OpenModelicaRegistry.git"))
            siblings = [
              "../Absyn.jl",
              "../ArrayUtil.jl",
              "../DAE.jl",
              "../DoubleEnded.jl",
              "../ImmutableList.jl",
              "../ListUtil.jl",
              "../MetaModelica.jl",
              "../OMParser.jl",
              "../OMRuntimeExternalC.jl",
              "../SCode.jl",
            ]
            Pkg.develop([Pkg.PackageSpec(path = p) for p in siblings])
            Pkg.build(; verbose = true)
            Pkg.resolve()
          '

      - name: Instantiate docs environment
        # The docs environment lives under docs/. Its [sources] entry for
        # OMFrontend points at "..", but the transitive sibling deps still
        # need to be developed against the local checkouts to avoid pulling
        # stale registry versions.
        shell: bash
        working-directory: OMFrontend.jl
        run: |
          julia --project=docs -e '
            import Pkg
            siblings = [
              "../Absyn.jl",
              "../ArrayUtil.jl",
              "../DAE.jl",
              "../DoubleEnded.jl",
              "../ImmutableList.jl",
              "../ListUtil.jl",
              "../MetaModelica.jl",
              "../OMParser.jl",
              "../OMRuntimeExternalC.jl",
              "../SCode.jl",
            ]
            # Develop OMFrontend together with the siblings in a single call.
            # Developing the siblings first re-resolves the docs environment
            # while OMFrontend is still a registry/git dependency, which makes
            # Pkg clone it from GitHub and fail on its test submodule.
            specs = [Pkg.PackageSpec(path = p) for p in siblings]
            push!(specs, Pkg.PackageSpec(path = pwd()))
            Pkg.develop(specs)
            Pkg.instantiate()
          '

      - name: Build (and deploy) docs
        shell: bash
        working-directory: OMFrontend.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
        run: julia --project=docs --color=yes docs/make.jl
