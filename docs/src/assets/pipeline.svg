<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Helvetica, Arial, sans-serif">
  <title>How OMFrontend translates Modelica to a flat model</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4e9c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="330" fill="#ffffff"/>

  <!-- instantiate() covers parse to flat model -->
  <path d="M178,44 V36 H940 V44" fill="none" stroke="#111111" stroke-width="1.2"/>
  <text x="559" y="27" text-anchor="middle" font-size="14" fill="#111111"><tspan font-family="Menlo, Consolas, monospace" font-weight="bold">instantiate()</tspan>, <tspan font-family="Menlo, Consolas, monospace" font-weight="bold">flatModelica()</tspan>, <tspan font-family="Menlo, Consolas, monospace" font-weight="bold">check()</tspan></text>

  <!-- the six stages -->
  <g font-size="12" fill="#111111">
    <rect x="20" y="56" width="130" height="96" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="2"/>
    <rect x="20" y="56" width="130" height="28" rx="8" fill="#1f4e9c"/><rect x="20" y="72" width="130" height="12" fill="#1f4e9c"/>
    <text x="85" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Modelica</text>
    <text x="85" y="104" text-anchor="middle">a .mo file,</text>
    <text x="85" y="120" text-anchor="middle">a string,</text>
    <text x="85" y="136" text-anchor="middle">libraries</text>

    <rect x="178" y="56" width="130" height="96" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="2"/>
    <rect x="178" y="56" width="130" height="28" rx="8" fill="#1f4e9c"/><rect x="178" y="72" width="130" height="12" fill="#1f4e9c"/>
    <text x="243" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Parse</text>
    <text x="243" y="104" text-anchor="middle">syntax tree</text>
    <text x="243" y="120" text-anchor="middle">(Absyn)</text>
    <text x="243" y="136" text-anchor="middle" font-size="11">OpenModelicaParser</text>

    <rect x="336" y="56" width="130" height="96" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="2"/>
    <rect x="336" y="56" width="130" height="28" rx="8" fill="#1f4e9c"/><rect x="336" y="72" width="130" height="12" fill="#1f4e9c"/>
    <text x="401" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">SCode</text>
    <text x="401" y="104" text-anchor="middle">classes, elements,</text>
    <text x="401" y="120" text-anchor="middle">modifiers; the</text>
    <text x="401" y="136" text-anchor="middle">library cache</text>

    <rect x="494" y="56" width="130" height="96" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="2"/>
    <rect x="494" y="56" width="130" height="28" rx="8" fill="#1f4e9c"/><rect x="494" y="72" width="130" height="12" fill="#1f4e9c"/>
    <text x="559" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Instantiate</text>
    <text x="559" y="104" text-anchor="middle">instance tree:</text>
    <text x="559" y="120" text-anchor="middle">lookup, extends,</text>
    <text x="559" y="136" text-anchor="middle">modifiers</text>

    <rect x="652" y="56" width="130" height="96" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="2"/>
    <rect x="652" y="56" width="130" height="28" rx="8" fill="#1f4e9c"/><rect x="652" y="72" width="130" height="12" fill="#1f4e9c"/>
    <text x="717" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Type, flatten</text>
    <text x="717" y="104" text-anchor="middle">types, bindings,</text>
    <text x="717" y="120" text-anchor="middle">connections,</text>
    <text x="717" y="136" text-anchor="middle">arrays to scalars</text>

    <rect x="810" y="56" width="130" height="96" rx="8" fill="#ffffff" stroke="#1f4e9c" stroke-width="2"/>
    <rect x="810" y="56" width="130" height="28" rx="8" fill="#1f4e9c"/><rect x="810" y="72" width="130" height="12" fill="#1f4e9c"/>
    <text x="875" y="75" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Flat model</text>
    <text x="875" y="104" text-anchor="middle">variables,</text>
    <text x="875" y="120" text-anchor="middle">equations,</text>
    <text x="875" y="136" text-anchor="middle">functions</text>
  </g>

  <!-- arrows between the stages -->
  <g stroke="#1f4e9c" stroke-width="2" marker-end="url(#arrow)">
    <line x1="150" y1="104" x2="176" y2="104"/>
    <line x1="308" y1="104" x2="334" y2="104"/>
    <line x1="466" y1="104" x2="492" y2="104"/>
    <line x1="624" y1="104" x2="650" y2="104"/>
    <line x1="782" y1="104" x2="808" y2="104"/>
  </g>

  <!-- functions that read the classes (SCode) -->
  <line x1="401" y1="152" x2="401" y2="196" stroke="#111111" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="178" y="196" width="446" height="40" rx="20" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
  <text x="401" y="221" text-anchor="middle" font-size="13" font-family="Menlo, Consolas, monospace" fill="#111111">classNames  source  description  documentation</text>
  <text x="401" y="256" text-anchor="middle" font-size="12" fill="#111111">read the classes without translating them</text>

  <!-- what the flat model gives -->
  <g stroke="#1f4e9c" stroke-width="2" marker-end="url(#arrow)">
    <line x1="875" y1="152" x2="875" y2="182"/>
  </g>
  <g font-size="12" fill="#111111">
    <rect x="652" y="184" width="288" height="36" rx="6" fill="#ffffff" stroke="#1f4e9c" stroke-width="1.5"/>
    <text x="796" y="207" text-anchor="middle"><tspan font-family="Menlo, Consolas, monospace">print(fm)</tspan>: flat Modelica text</text>
    <rect x="652" y="226" width="288" height="36" rx="6" fill="#ffffff" stroke="#1f4e9c" stroke-width="1.5"/>
    <text x="796" y="249" text-anchor="middle" font-family="Menlo, Consolas, monospace">variables  parameters  exportJSON</text>
    <rect x="652" y="268" width="288" height="36" rx="6" fill="#1f4e9c"/>
    <text x="796" y="291" text-anchor="middle" fill="#ffffff">OMBackend.jl: simulation (OM.jl)</text>
  </g>
</svg>
